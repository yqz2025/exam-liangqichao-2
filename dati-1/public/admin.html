<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
        body{background:#f5f7fa;padding:20px}
        .login-box{max-width:400px;margin:60px auto;background:white;padding:40px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.08)}
        .login-box h3{margin-bottom:20px;text-align:center}
        input{width:100%;padding:14px;margin-bottom:16px;border:1px solid #ddd;border-radius:8px}
        button{padding:14px 20px;background:#2d67ea;color:white;border:none;border-radius:8px;width:100%;cursor:pointer}
        .admin{max-width:1200px;margin:0 auto}
        .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:15px}
        .export{background:#43a047;padding:10px 20px;color:white;border:none;border-radius:8px;cursor:pointer}
        table{width:100%;background:white;border-radius:8px;overflow:hidden;border-collapse:collapse}
        th,td{padding:14px;text-align:left;border-bottom:1px solid #eee}
        th{background:#2d67ea;color:white}
    </style>
</head>
<body>
    <div id="login" class="login-box">
        <h3>管理员登录</h3>
        <input id="pwd" type="password" placeholder="请输入管理员密码">
        <button onclick="login()">登录后台</button>
    </div>

    <div id="admin" style="display:none" class="admin">
        <div class="top">
            <h2>学生答题成绩管理</h2>
            <button class="export" onclick="exportExcel()">导出Excel成绩单</button>
        </div>
        <table>
            <thead>
                <tr><th>姓名</th><th>班别</th><th>专业部门</th><th>开始时间</th><th>交卷时间</th><th>得分</th><th>状态</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

    <script>
        async function login(){
            const pwd = document.getElementById('pwd').value
            const r = await fetch('/api/admin-login',{
                method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({password:pwd})
            })
            const d = await r.json()
            if(d.success){
                document.getElementById('login').style.display='none'
                document.getElementById('admin').style.display='block'
                loadList()
            }else{
                alert('密码错误，请重新输入')
            }
        }
        async function loadList(){
            const r = await fetch('/api/admin/students')
            const list = await r.json()
            document.getElementById('list').innerHTML = list.map(s=>`
            <tr>
                <td>${s.name}</td><td>${s.class}</td><td>${s.major}</td>
                <td>${s.start_time||'-'}</td><td>${s.end_time||'-'}</td>
                <td>${s.score}</td><td>${s.finished?'已完成':'未完成'}</td>
            </tr>`).join('')
        }
        function exportExcel(){
            window.open('/api/admin/export')
        }
    </script>
</body>
</html>
